name: Path Policy

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  enforce-editable-paths:
    name: Enforce editable paths
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Reject changes outside src and test
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              },
            );

            if (files.length !== context.payload.pull_request.changed_files) {
              core.setFailed(
                "Unable to inspect every changed file, so this pull request is blocked.",
              );
              return;
            }

            const allowedPrefixes = ["src/", "test/"];
            const touchedPaths = files.flatMap(({ filename, previous_filename }) =>
              previous_filename ? [previous_filename, filename] : [filename],
            );
            const disallowedFiles = [...new Set(touchedPaths)]
              .filter(
                (filename) =>
                  !allowedPrefixes.some((prefix) => filename.startsWith(prefix)),
              );

            if (disallowedFiles.length > 0) {
              core.setFailed(
                `Changes are allowed only in src/ and test/. Disallowed paths:\n${disallowedFiles
                  .map((filename) => `- ${filename}`)
                  .join("\n")}`,
              );
            }
